name: Package desktop

# Builds Win/macOS/Linux installers (with companion APKs + adb) on every push/PR
# and replaces the ci-latest release assets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: package-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  companion-apks:
    name: Build companion APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Ensure debug keystore (sideload signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"
          if [[ ! -f "$KS" ]]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APKs
        shell: bash
        run: |
          ./gradlew :androidApp:assembleRelease :wearApp:assembleRelease \
            --no-daemon --console=plain

      - name: Stage companion APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p companion-apks
          PHONE=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          WEAR=$(find wearApp/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$PHONE" && test -n "$WEAR"
          cp -v "$PHONE" companion-apks/keepstraight-phone.apk
          cp -v "$WEAR" companion-apks/keepstraight-wear.apk
          ls -lah companion-apks

      - name: Upload companion APKs
        uses: actions/upload-artifact@v4
        with:
          name: KeepStraight-companion-apks
          path: companion-apks/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (${{ matrix.target }})
    needs: companion-apks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            tasks: ":desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi"
            patterns: "*.exe *.msi"
          - os: macos-latest
            target: macos
            tasks: ":desktopApp:packageReleaseDmg"
            patterns: "*.dmg"
          - os: ubuntu-latest
            target: linux
            tasks: ":desktopApp:packageReleaseDeb"
            patterns: "*.deb"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX (Windows jpackage)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          if command -v candle >/dev/null 2>&1; then
            echo "WiX already on PATH"
          elif [[ -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ]]; then
            echo "WiX found under Program Files"
          else
            choco install wixtoolset -y --no-progress
          fi
          if [[ -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ]]; then
            echo "/c/Program Files (x86)/WiX Toolset v3.14/bin" >> "$GITHUB_PATH"
          fi

      - name: Download companion APKs into desktop resources
        uses: actions/download-artifact@v4
        with:
          name: KeepStraight-companion-apks
          path: desktopApp/src/main/resources/apks

      - name: Verify bundled adb + APKs
        shell: bash
        run: |
          set -euo pipefail
          ls -lah desktopApp/src/main/resources/apks/
          test -f desktopApp/src/main/resources/apks/keepstraight-phone.apk
          test -f desktopApp/src/main/resources/apks/keepstraight-wear.apk
          test -f desktopApp/src/main/resources/adb/macos/adb
          test -f desktopApp/src/main/resources/adb/linux/adb
          test -f desktopApp/src/main/resources/adb/windows/adb.exe
          test -f desktopApp/src/main/resources/adb/windows/AdbWinApi.dll
          test -f desktopApp/src/main/resources/adb/windows/AdbWinUsbApi.dll

      - name: Download MoveNet model
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="desktopApp/src/main/resources/models"
          OUT_FILE="$OUT_DIR/movenet_lightning.onnx"
          mkdir -p "$OUT_DIR"
          URL="${MOVENET_ONNX_URL:-https://huggingface.co/Xenova/movenet-singlepose-lightning/resolve/main/onnx/model.onnx}"
          if [[ -x desktopApp/scripts/download-movenet.sh ]]; then
            ./desktopApp/scripts/download-movenet.sh
          else
            echo "Downloading MoveNet Lightning ONNX to $OUT_FILE"
            curl -L --fail -o "$OUT_FILE" "$URL"
          fi
          ls -lh "$OUT_FILE"

      - name: Import macOS signing certificate
        if: matrix.target == 'macos'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERT_P12:-}" ]]; then
            echo "APPLE_CERT_P12 not configured — building unsigned DMG"
            exit 0
          fi
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          bash desktopApp/scripts/import-macos-signing-cert.sh \
            "$RUNNER_TEMP/certificate.p12" \
            "$APPLE_CERT_PASSWORD"

      - name: Package desktop
        shell: bash
        env:
          PACKAGE_VERSION: "1.0.${{ github.run_number }}"
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          COMMON_ARGS=(
            -Pkeepstraight.skipApkSync=true
            -Pkeepstraight.packageVersion="$PACKAGE_VERSION"
            --no-daemon
            --console=plain
          )
          if [[ "${{ matrix.target }}" == "macos" ]]; then
            MAC_ARGS=("${COMMON_ARGS[@]}")
            if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              MAC_ARGS+=(
                -Pcompose.desktop.mac.sign=true
                "-Pcompose.desktop.mac.signing.identity=${MACOS_SIGNING_IDENTITY}"
              )
              if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
                MAC_ARGS+=("-Pcompose.desktop.mac.signing.keychain=${MACOS_SIGNING_KEYCHAIN}")
              fi
            fi
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              echo "Building signed + notarized DMG"
              ./gradlew :desktopApp:notarizeReleaseDmg "${MAC_ARGS[@]}" \
                -Pcompose.desktop.mac.notarization.appleID="$APPLE_ID" \
                -Pcompose.desktop.mac.notarization.password="$APPLE_APP_SPECIFIC_PASSWORD" \
                -Pcompose.desktop.mac.notarization.teamID="$APPLE_TEAM_ID"
            else
              echo "Building DMG (signing/notarization skipped — missing secrets)"
              ./gradlew :desktopApp:packageReleaseDmg "${MAC_ARGS[@]}"
            fi
          else
            ./gradlew ${{ matrix.tasks }} "${COMMON_ARGS[@]}"
          fi

      - name: Sign Windows installers (Authenticode)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX)) {
            Write-Host "WINDOWS_CERT_PFX not configured — skipping Authenticode"
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          ./desktopApp/scripts/sign-windows-artifacts.ps1 `
            -DistDir "desktopApp/build/compose/binaries" `
            -PfxPath $pfxPath `
            -PfxPassword $env:WINDOWS_CERT_PASSWORD

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          # shellcheck disable=SC2086
          for pattern in ${{ matrix.patterns }}; do
            find desktopApp/build/compose/binaries -type f -name "$pattern" -exec cp -v {} "dist/${{ matrix.target }}/" \;
          done
          ls -la "dist/${{ matrix.target }}"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepStraight-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish-ci-latest:
    name: Publish ci-latest release
    needs: package
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: KeepStraight-*
          merge-multiple: false

      - name: Flatten assets
        shell: bash
        run: |
          mkdir -p out
          find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) \
            -exec cp -v {} out/ \;
          ls -lah out
          test "$(find out -type f | wc -l)" -gt 0

      - name: Replace ci-latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="Automated desktop builds from CI (run ${{ github.run_number }}).
          Source: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}

          Each installer bundles MoveNet, platform adb (Win/macOS/Linux), and the phone + watch APKs for wireless sideload.
          macOS builds are signed/notarized when APPLE_* secrets are set; Windows builds are Authenticode-signed when WINDOWS_CERT_* secrets are set.
          See docs/CODE_SIGNING.md for secret setup.
          These assets are overwritten on every push/PR build from this repository."

          if gh release view ci-latest >/dev/null 2>&1; then
            gh release edit ci-latest \
              --title "KeepStraight desktop (CI latest)" \
              --notes "$NOTES"
            mapfile -t OLD < <(gh release view ci-latest --json assets -q '.assets[].name')
            for name in "${OLD[@]:-}"; do
              [[ -n "$name" ]] || continue
              gh release delete-asset ci-latest "$name" --yes || true
            done
          else
            gh release create ci-latest \
              --target "${{ github.sha }}" \
              --title "KeepStraight desktop (CI latest)" \
              --notes "$NOTES" \
              --prerelease
          fi

          gh release upload ci-latest out/* --clobber
          echo "Published:"
          gh release view ci-latest
