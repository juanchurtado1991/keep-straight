[versions]
agp                      = "8.10.0"
kotlin                   = "2.4.0"
ksp                      = "2.3.10"
compose-bom              = "2024.12.01"
wear-compose             = "1.4.0"
activity-compose         = "1.9.3"
lifecycle                = "2.8.7"
navigation               = "2.8.5"
room                     = "2.7.0"
datastore                = "1.1.1"
paging                   = "3.3.5"
play-services-wearable   = "19.0.0"
coroutines               = "1.9.0"
ghost                    = "1.3.0"

[libraries]
androidx-core-ktx                    = { module = "androidx.core:core-ktx",                              version = "1.15.0" }
androidx-lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx",             version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",     version.ref = "lifecycle" }
androidx-activity-compose            = { module = "androidx.activity:activity-compose",                 version.ref = "activity-compose" }
androidx-navigation-compose          = { module = "androidx.navigation:navigation-compose",             version.ref = "navigation" }
compose-bom                          = { module = "androidx.compose:compose-bom",                       version.ref = "compose-bom" }
compose-ui                           = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview           = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3                    = { module = "androidx.compose.material3:material3" }
compose-ui-tooling                   = { module = "androidx.compose.ui:ui-tooling" }
wear-compose-material                = { module = "androidx.wear.compose:compose-material",               version.ref = "wear-compose" }
wear-compose-foundation              = { module = "androidx.wear.compose:compose-foundation",             version.ref = "wear-compose" }
room-runtime                         = { module = "androidx.room:room-runtime",                           version.ref = "room" }
room-ktx                             = { module = "androidx.room:room-ktx",                               version.ref = "room" }
room-paging                          = { module = "androidx.room:room-paging",                            version.ref = "room" }
room-compiler                        = { module = "androidx.room:room-compiler",                          version.ref = "room" }
datastore-preferences                = { module = "androidx.datastore:datastore-preferences",             version.ref = "datastore" }
paging-runtime                       = { module = "androidx.paging:paging-runtime",                         version.ref = "paging" }
paging-compose                       = { module = "androidx.paging:paging-compose",                         version.ref = "paging" }
play-services-wearable               = { module = "com.google.android.gms:play-services-wearable",        version.ref = "play-services-wearable" }
kotlinx-coroutines-core              = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",        version.ref = "coroutines" }
kotlinx-coroutines-android           = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-coroutines-play-services     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
ghost-serialization                  = { module = "com.ghostserializer:ghost-serialization",              version.ref = "ghost" }
kotlin-test                          = { module = "org.jetbrains.kotlin:kotlin-test",                       version.ref = "kotlin" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
android-library      = { id = "com.android.library",                  version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
ghost                = { id = "com.ghostserializer.ghost",              version.ref = "ghost" }
